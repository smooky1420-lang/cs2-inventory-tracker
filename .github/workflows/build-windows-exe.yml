name: Build Windows exe

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run pack:win
      - uses: actions/upload-artifact@v4
        with:
          name: CS2InventoryTracker-windows
          path: release/CS2InventoryTracker.exe
      - if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: release/CS2InventoryTracker.exe
